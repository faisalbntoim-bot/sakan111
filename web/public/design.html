  /* =========================================================================
     SakanAR — واقع معزّز حقيقي قائم على الموقع (كاميرا + بوصلة + GPS)
     - لا مكتبات خارجية: كاميرا getUserMedia + DeviceOrientation + Geolocation
     - يُسقط الأراضي القريبة على مشهد الكاميرا، يرسم حدودها ويعرض بطاقتها
     - بنية نظيفة: أضِف لاحقًا (أراضٍ متعددة/ألوان الحالة/نماذج GLB/قياس/أثاث)
     ========================================================================= */
  const SakanAR = (function(){
    const cfg = {
      fovH: 63,               // مجال الرؤية الأفقي للكاميرا (تقريبي للجوال)
      searchRadiusM: 1500,    // نطاق البحث عن الأراضي القريبة (متر)
      weakAccuracyM: 60,      // تحذير إن كانت دقة GPS أسوأ من هذا
      horizonY: 0.5,          // موضع الأفق كنسبة من الارتفاع
      eyeHeight: 1.6,         // ارتفاع نظر المستخدم (متر) لإسقاط الأرض
      approxOffsetM: 70,      // مسافة الموقع التقريبي جنوب الأرض عند تعذّر GPS
      floorH: 3.1,            // ارتفاع الدور للنموذج ثلاثي الأبعاد
      colors: {
        available:{ line:'#3DE8A6', fill:'rgba(46,158,119,0.26)', tag:'#1f8f63' },
        sold:     {  line:'#FF7A7A', fill:'rgba(214,61,66,0.24)',  tag:'#d63d42' },
        reserved: { line:'#F6C455', fill:'rgba(232,145,47,0.24)',  tag:'#c9821f' },
      },
      statusLabel:{ available:'متاحة للبيع', sold:'مباعة', reserved:'محجوزة' },
    };
    // حالة قابلة للاستبدال لاحقًا بنموذج GLB/GLTF: {type:'box',floors} → {type:'glb',url}
    const model = { type:'box', floors:4 };

    let S=null, opening=false; // جلسة نشطة + قفل ضد الفتح المزدوج

    // ---------- رياضيات جغرافية ----------
    const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
    const norm180=a=>{ a=((a+180)%360+360)%360-180; return a; };
    function bearing(lat1,lng1,lat2,lng2){
      const φ1=toRad(lat1),φ2=toRad(lat2),Δλ=toRad(lng2-lng1);
      const y=Math.sin(Δλ)*Math.cos(φ2);
      const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return (toDeg(Math.atan2(y,x))+360)%360;
    }
    function distM(lat1,lng1,lat2,lng2){ return haversineKm(lat1,lng1,lat2,lng2)*1000; }
    // زوايا/إزاحات بالأمتار → درجات
    function mPerDegLat(){ return 111320; }
    function mPerDegLng(lat){ return 111320*Math.cos(toRad(lat)); }

    // حدود قطعة الأرض: يستخدم p.boundary لو وُجد ([[lat,lng]..]) وإلا مربّع من المركز+المساحة
    function landCorners(p){
      if(Array.isArray(p.boundary)&&p.boundary.length>=3) return p.boundary.map(c=>({lat:c[0],lng:c[1]}));
      const side=Math.sqrt(Math.max(p.area||400,50)); const h=side/2;
      const dLat=h/mPerDegLat(), dLng=h/mPerDegLng(p.lat);
      return [
        {lat:p.lat+dLat,lng:p.lng-dLng},{lat:p.lat+dLat,lng:p.lng+dLng},
        {lat:p.lat-dLat,lng:p.lng+dLng},{lat:p.lat-dLat,lng:p.lng-dLng},
      ];
    }
    function statusOf(p){ return p.arStatus || (p.available? 'available':'sold'); }

    // ---------- الإسقاط: نقطة أرضية (على مستوى الأرض) إلى إحداثيات الشاشة ----------
    function fovV(){ return cfg.fovH * (S.h/S.w); }
    function projectGround(lat,lng){
      const u=S.user;
      const b=bearing(u.lat,u.lng,lat,lng);
      const d=Math.max(distM(u.lat,u.lng,lat,lng),0.5);
      const rel=norm180(b - S.heading);                  // زاوية أفقية عن مركز الكاميرا
      const x=S.w/2 + (rel/(cfg.fovH/2))*(S.w/2);
      const depr=toDeg(Math.atan2(cfg.eyeHeight, d));    // زاوية انخفاض النقطة الأرضية
      const y=S.h*cfg.horizonY + (depr/(fovV()/2))*(S.h/2);
      return {x,y,rel,d};
    }
    // نقطة مرتفعة (لها ارتفاع alt متر) فوق موقع أرضي
    function projectPoint(lat,lng,alt){
      const g=projectGround(lat,lng);
      if(alt){ const elev=toDeg(Math.atan2(alt, Math.max(g.d,0.5))); g.y -= (elev/(fovV()/2))*(S.h/2); }
      return g;
    }
    // تحويل إزاحة محلية بالأمتار (east,north) حول مركز إلى lat/lng
    function offsetLL(c, east, north){ return { lat:c.lat + north/mPerDegLat(), lng:c.lng + east/mPerDegLng(c.lat) }; }

    // ---------- الرسم ----------
    function clear(){ S.ctx.clearRect(0,0,S.cv.width,S.cv.height); }
    function drawLand(p){
      const col=cfg.colors[statusOf(p)]||cfg.colors.available;
      const pts=landCorners(p).map(c=>projectGround(c.lat,c.lng));
      const anyFront=pts.some(pt=>Math.abs(pt.rel)<80);
      const ctx=S.ctx, dpr=S.dpr;
      if(anyFront){
        ctx.save(); ctx.beginPath();
        pts.forEach((pt,i)=>{ const X=pt.x*dpr, Y=pt.y*dpr; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
        ctx.closePath();
        ctx.fillStyle=col.fill; ctx.fill();
        ctx.lineWidth=3*dpr; ctx.strokeStyle=col.line; ctx.lineJoin='round';
        ctx.shadowColor=col.line; ctx.shadowBlur=12*dpr; ctx.stroke();
        ctx.shadowBlur=0;
        // أوتاد زوايا
        pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x*dpr,pt.y*dpr,4*dpr,0,7); ctx.fillStyle=col.line; ctx.fill(); });
        ctx.restore();
      }
      return { center:projectGround(p.lat,p.lng), col, anyFront };
    }
    // نموذج مبنى ثلاثي الأبعاد حقيقي مُسقط (صندوق قابل للدوران) — جاهز لاستبدال GLB
    function drawBuilding(p){
      const side=Math.min(Math.sqrt(Math.max(p.area||400,60)), 34); // بصمة المبنى (متر)
      const h=Math.max(model.floors,1)*cfg.floorH;
      const rot=toRad(S.modelRot);
      const hw=side/2;
      // أركان البصمة محليًا (east,north) بعد الدوران حول المركز
      const foot=[[-hw,-hw],[hw,-hw],[hw,hw],[-hw,hw]].map(([e,n])=>{
        const e2=e*Math.cos(rot)-n*Math.sin(rot), n2=e*Math.sin(rot)+n*Math.cos(rot);
        return offsetLL({lat:p.lat,lng:p.lng}, e2, n2);
      });
      const base=foot.map(ll=>projectPoint(ll.lat,ll.lng,0));
      const top =foot.map(ll=>projectPoint(ll.lat,ll.lng,h));
      if(!base.some(b=>Math.abs(b.rel)<80)) return false;
      const ctx=S.ctx,dpr=S.dpr;
      const faces=[ [0,1], [1,2], [2,3], [3,0] ].map(([a,b])=>({
        quad:[base[a],base[b],top[b],top[a]], depth:(base[a].d+base[b].d)/2
      })).sort((A,B)=>B.depth-A.depth);
      ctx.save();
      faces.forEach((f,i)=>{
        ctx.beginPath();
        f.quad.forEach((pt,j)=>{ const X=pt.x*dpr,Y=pt.y*dpr; j?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
        ctx.closePath();
        const shade=0.30+0.13*i;
        ctx.fillStyle=`rgba(46,158,119,${shade.toFixed(2)})`;
        ctx.fill();
        ctx.lineWidth=1.6*dpr; ctx.strokeStyle='rgba(143,230,194,0.9)'; ctx.stroke();
      });
      // السطح
      ctx.beginPath();
      top.forEach((pt,j)=>{ const X=pt.x*dpr,Y=pt.y*dpr; j?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
      ctx.closePath(); ctx.fillStyle='rgba(124,240,196,0.5)'; ctx.fill();
      ctx.lineWidth=2*dpr; ctx.strokeStyle='#8fe6c2'; ctx.shadowColor='#8fe6c2'; ctx.shadowBlur=10*dpr; ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      return true;
    }

    // ---------- حلقة الرسم ----------
    function frame(){
      if(!S) return;
      clear();
      let primary=null, best=Infinity;
      S.lands.forEach(p=>{
        const r=drawLand(p);
        if(S.showBuilding && p===S.target) drawBuilding(p);
        const dd=distM(S.user.lat,S.user.lng,p.lat,p.lng);
        if(r.anyFront && Math.abs(r.center.rel)<cfg.fovH*0.6 && dd<best){ best=dd; primary={p,r}; }
      });
      positionCard(primary);
      updateHud();
      S.raf=requestAnimationFrame(frame);
    }
    function positionCard(primary){
      const card=S.el.card;
      if(!primary){ card.classList.remove('show'); return; }
      const p=primary.p, c=primary.r.center;
      if(S.cardIdx!==p._idx){ S.cardIdx=p._idx; fillCard(p); }
      card.classList.add('show');
      let x=c.x, y=Math.min(c.y, S.h*0.62);
      const cw=card.offsetWidth||220, ch=card.offsetHeight||120;
      x=Math.max(cw/2+10, Math.min(S.w-cw/2-10, x));
      y=Math.max(ch+70, y);
      card.style.left=x+'px'; card.style.top=(y-ch-24)+'px';
      S.el.pin.classList.add('show'); S.el.pin.style.left=c.x+'px'; S.el.pin.style.top=c.y+'px';
      S.el.buildBtn.dataset.idx=p._idx;
    }
    function fillCard(p){
      const st=statusOf(p), col=cfg.colors[st]||cfg.colors.available;
      S.target=p;
      S.el.card.dataset.idx=p._idx;
      S.el.card.style.setProperty('--arc', col.tag);
      S.el.card.querySelector('.arc-status').textContent=cfg.statusLabel[st]||'';
      S.el.card.querySelector('.arc-title').textContent = st==='available'?'أرض للبيع':(st==='sold'?'أرض مباعة':'أرض محجوزة');
      S.el.card.querySelector('.arc-area').textContent = nfA(p.area)+' م²';
      S.el.card.querySelector('.arc-price').textContent = nfA(p.price)+' ريال';
      S.el.card.querySelector('.arc-hood').textContent = p.neighborhood+' — الرياض';
      S.el.card.querySelector('.arc-id').textContent = 'المعرّف: LAND-'+String(1000+p._idx);
    }
    function updateHud(){
      if(!S.el.hud) return;
      const acc=S.accuracy!=null?('±'+Math.round(S.accuracy)+'م'):'—';
      S.el.hud.querySelector('.arh-head').textContent = Math.round(((S.heading%360)+360)%360)+'°';
      S.el.hud.querySelector('.arh-acc').textContent = acc;
      S.el.hud.querySelector('.arh-count').textContent = nfA(S.lands.length);
    }

    // ---------- الحسّاسات ----------
    function onOrient(e){
      if(!S) return;
      let hd=null;
      if(typeof e.webkitCompassHeading==='number' && !isNaN(e.webkitCompassHeading)) hd=e.webkitCompassHeading;
      else if(e.absolute && typeof e.alpha==='number') hd=(360-e.alpha);
      if(hd==null) return;
      const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
      hd=(hd+so+360)%360;
      S.sensorHeading=hd; S.gotSensor=true;
      if(!S.manual) S.heading=hd + S.dragOffset;
    }
    function startGeo(){
      if(!navigator.geolocation){ return; }
      S.geoWatch=navigator.geolocation.watchPosition(pos=>{
        if(!S) return;
        const first=!S.hasGeo;
        S.user={lat:pos.coords.latitude,lng:pos.coords.longitude};
        S.accuracy=pos.coords.accuracy;
        S.hasGeo=true;
        if(first) S.el.toast.classList.remove('show'); // أزل إشعار الموقع التقريبي عند وصول GPS حقيقي
        S.el.accBanner.classList.toggle('show', pos.coords.accuracy>cfg.weakAccuracyM);
        S.el.accBanner.querySelector('b').textContent='±'+Math.round(pos.coords.accuracy)+'م';
        computeLands();
      }, err=>{
        if(S && !S.hasGeo) geoFallback(false);
      }, {enableHighAccuracy:true, maximumAge:1000, timeout:12000});
    }
    function geoFallback(silent){
      // موقع تقريبي جنوب الأرض المستهدفة حتى تظهر أمام المستخدم — مع إشعار واضح
      const t=properties[S.startIdx];
      S.user=offsetLL({lat:t.lat,lng:t.lng}, 0, -cfg.approxOffsetM);
      S.accuracy=null;
      S.baseHeading = bearing(S.user.lat,S.user.lng,t.lat,t.lng); // الأرض أمام المستخدم مبدئيًا
      S.heading = S.baseHeading; S.dragOffset=0;
      if(!silent) showNotice('geo');
      computeLands();
    }
    function computeLands(){
      const near=properties.map((p,i)=>({p,i})).filter(o=>o.p.category==='أرض'
        && distM(S.user.lat,S.user.lng,o.p.lat,o.p.lng)<=cfg.searchRadiusM);
      S.lands = near.map(o=>{ o.p._idx=o.i; return o.p; });
      if(!S.lands.length){ showNotice('none'); }
      else { hideNotice('none'); if(!S.target){ S.target=properties[S.startIdx]; S.target._idx=S.startIdx; } }
    }

    // ---------- الأخطاء/الإشعارات ----------
    const NOTICE={
      unsupported:{t:'جهازك لا يدعم الواقع المعزز', s:'يتطلب كاميرا وحسّاسات اتجاه. جرّب من متصفح جوال حديث عبر HTTPS.', ic:'📵', block:true},
      camera:{t:'لم يُسمح بالوصول للكاميرا', s:'فعّل إذن الكاميرا من إعدادات المتصفح ثم أعد المحاولة.', ic:'📷', block:true, retry:true},
      geo:{t:'تعذّر تحديد موقعك بدقة', s:'نعرض لك عرضًا تقريبيًا أمام الأرض. فعّل الموقع لتجربة أدق.', ic:'📍', block:false},
      none:{t:'لا توجد أرض قريبة منك', s:'ابتعد ضمن نطاق ١٫٥ كم من أرض معروضة، أو جرّب من موقع الأرض.', ic:'🗺️', block:false},
      nomodel:{t:'لا يوجد نموذج ثلاثي الأبعاد', s:'لم يُرفق هذا العقار بنموذج مبنى بعد.', ic:'🏗️', block:false},
    };
    function showNotice(kind){
      if(!S) return; const n=NOTICE[kind]; if(!n) return;
      if(n.block){ const b=S.el.block; b.querySelector('.arn-ic').textContent=n.ic; b.querySelector('.arn-t').textContent=n.t;
        b.querySelector('.arn-s').textContent=n.s; b.querySelector('.arn-retry').style.display=n.retry?'':'none';
        b.classList.add('show'); }
      else { S.el.toast.querySelector('.art-ic').textContent=n.ic; S.el.toast.querySelector('.art-t').textContent=n.t;
        S.el.toast.querySelector('.art-s').textContent=n.s; S.el.toast.classList.add('show');
        clearTimeout(S._tt); S._tt=setTimeout(()=>{ if(S) S.el.toast.classList.remove('show'); }, kind==='geo'?4200:3200); }
    }
    // يخفي فقط الإشعار غير الحاجب (التوست). الشاشة الحاجبة (كاميرا/غير مدعوم) تبقى حتى إعادة المحاولة/الإغلاق
    function hideNotice(){ if(S) S.el.toast.classList.remove('show'); }

    // ---------- بناء الواجهة (RTL) ----------
    function buildDom(){
      const root=document.createElement('div'); root.className='skar-view'; root.dir='rtl';
      root.innerHTML=`
        <video class="ar-cam" playsinline muted autoplay></video>
        <div class="ar-scrim"></div>
        <canvas class="ar-canvas"></canvas>
        <div class="ar-pin"><span class="ar-pin-dot"></span></div>
        <div class="ar-topbar">
          <button class="ar-close" data-arx="close" aria-label="إغلاق">✕</button>
          <div class="ar-hud"><span class="arh-item">🧭 <b class="arh-head">0°</b></span><span class="arh-item">🎯 <b class="arh-acc">—</b></span><span class="arh-item">🗺️ <b class="arh-count">٠</b> أرض</span></div>
        </div>
        <div class="ar-acc-banner"><span>⚠️ دقة الموقع ضعيفة <b>±0م</b> — تحرّك للعراء لتحسينها</span></div>
        <div class="ar-hint">اسحب للاستعراض حول المكان · وجّه الكاميرا نحو الأرض</div>
        <div class="ar-card" data-arx="open">
          <span class="arc-badge">AR</span>
          <div class="arc-head"><span class="arc-status">متاحة</span><span class="arc-title">أرض للبيع</span></div>
          <div class="arc-rows">
            <div class="arc-row"><span>المساحة</span><b class="arc-area">—</b></div>
            <div class="arc-row"><span>السعر</span><b class="arc-price">—</b></div>
            <div class="arc-row"><span>الحي</span><b class="arc-hood">—</b></div>
          </div>
          <div class="arc-foot"><span class="arc-id">—</span><span class="arc-cta">التفاصيل ›</span></div>
        </div>
        <div class="ar-actions">
          <button class="skar-btn build" data-arx="build"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V8l6-4 6 4v13M10 21v-5h4v5"/></svg> شاهد المبنى هنا</button>
          <button class="skar-btn ghost" data-arx="recenter">إعادة توسيط</button>
        </div>
        <div class="ar-toast"><span class="art-ic">📍</span><div><b class="art-t"></b><small class="art-s"></small></div></div>
        <div class="ar-block">
          <div class="arn-card"><span class="arn-ic">📷</span><h3 class="arn-t"></h3><p class="arn-s"></p>
            <div class="arn-actions"><button class="arn-retry" data-arx="retry">إعادة المحاولة</button><button class="arn-close2" data-arx="close">إغلاق</button></div>
          </div>
        </div>`;
      document.body.appendChild(root);
      return root;
    }

    async function startCamera(){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showNotice('unsupported'); return false; }
      try{
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
        if(!S){ stream.getTracks().forEach(t=>t.stop()); return false; } // أُغلقت أثناء طلب الإذن
        S.stream=stream; S.el.video.srcObject=S.stream; await S.el.video.play().catch(()=>{});
        return true;
      }catch(err){
        showNotice(err&&err.name==='NotAllowedError'?'camera':'unsupported'); return false;
      }
    }
    async function startOrient(){
      try{
        if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
          const r=await DeviceOrientationEvent.requestPermission().catch(()=>'denied');
          if(r==='granted'){ window.addEventListener('deviceorientation', onOrient, true); }
        } else if(typeof DeviceOrientationEvent!=='undefined'){
          window.addEventListener('deviceorientationabsolute', onOrient, true);
          window.addEventListener('deviceorientation', onOrient, true);
        }
      }catch(e){}
      // إن لم يصل حسّاس خلال ثانيتين → وضع السحب اليدوي
      setTimeout(()=>{ if(S && !S.gotSensor){ S.manual=true; S.baseHeading=S.heading; S.el.hint.classList.add('show'); } }, 2000);
    }

    function sizeCanvas(){
      S.w=window.innerWidth; S.h=window.innerHeight; S.dpr=Math.min(window.devicePixelRatio||1,2);
      S.cv.width=S.w*S.dpr; S.cv.height=S.h*S.dpr; S.cv.style.width=S.w+'px'; S.cv.style.height=S.h+'px';
    }
    function wireDrag(){
      const el=S.root; let down=false, lastX=0;
      const start=x=>{ down=true; lastX=x; };
      const move=x=>{ if(!down) return; const dx=x-lastX; lastX=x; S.dragOffset=(S.dragOffset - dx*0.22); if(S.manual) S.heading=(S.baseHeading||0)+S.dragOffset; else S.heading=S.sensorHeading+S.dragOffset; };
      const end=()=>{ down=false; };
      el.addEventListener('touchstart',e=>{ if(e.target.closest('[data-arx]'))return; start(e.touches[0].clientX); },{passive:true});
      el.addEventListener('touchmove',e=>{ move(e.touches[0].clientX); },{passive:true});
      el.addEventListener('touchend',end);
      el.addEventListener('pointerdown',e=>{ if(e.target.closest('[data-arx]'))return; start(e.clientX); });
      el.addEventListener('pointermove',e=>move(e.clientX));
      window.addEventListener('pointerup',end);
    }

    function onAction(e){
      const b=e.target.closest('[data-arx]'); if(!b) return;
      const a=b.dataset.arx;
      if(a==='close'){ close(); }
      else if(a==='retry'){ S.el.block.classList.remove('show'); retry(); }
      else if(a==='open'){ const i=+S.el.card.dataset.idx; close(); H.openDetail(i); }
      else if(a==='build'){ toggleBuilding(); }
      else if(a==='recenter'){ S.dragOffset=0; if(S.manual&&S.target){ S.baseHeading=bearing(S.user.lat,S.user.lng,S.target.lat,S.target.lng); S.heading=S.baseHeading; } }
    }
    function toggleBuilding(){
      if(model.type==='glb' && !model.url){ showNotice('nomodel'); return; }
      S.showBuilding=!S.showBuilding;
      S.el.buildBtn.classList.toggle('on', S.showBuilding);
      S.el.buildBtn.childNodes[S.el.buildBtn.childNodes.length-1].textContent = S.showBuilding?' إخفاء المبنى':' شاهد المبنى هنا';
    }

    async function retry(){ await startCamera(); }

    async function open(startIdx){
      if(S||opening) return; opening=true;
      const root=buildDom();
      S={ root, startIdx, cv:root.querySelector('.ar-canvas'), heading:0, sensorHeading:0, baseHeading:0,
          dragOffset:0, manual:false, gotSensor:false, showBuilding:false, modelRot:0, lands:[], target:null,
          cardIdx:-1, accuracy:null, hasGeo:false, user:{lat:properties[startIdx].lat, lng:properties[startIdx].lng},
          el:{ video:root.querySelector('.ar-cam'), hud:root.querySelector('.ar-hud'), card:root.querySelector('.ar-card'),
               pin:root.querySelector('.ar-pin'), buildBtn:root.querySelector('.skar-btn.build'), hint:root.querySelector('.ar-hint'),
               accBanner:root.querySelector('.ar-acc-banner'), toast:root.querySelector('.ar-toast'), block:root.querySelector('.ar-block') } };
      opening=false;
      S.ctx=S.cv.getContext('2d');
      sizeCanvas();
      S._resize=()=>sizeCanvas(); window.addEventListener('resize', S._resize); window.addEventListener('orientationchange', S._resize);
      root.addEventListener('click', onAction);
      wireDrag();
      requestAnimationFrame(()=>root.classList.add('in'));
      const camOk=await startCamera();
      if(camOk) await startOrient();
      startGeo();
      // ابدأ فورًا بموقع تقريبي حتى يصل GPS (يظهر شيء دائمًا)
      if(!S.hasGeo){ geoFallback(true); }
      S.raf=requestAnimationFrame(frame);
    }
    function close(){
      opening=false;
      if(!S) return;
      cancelAnimationFrame(S.raf); clearTimeout(S._tt);
      if(S.stream) S.stream.getTracks().forEach(t=>t.stop());
      if(S.geoWatch!=null&&navigator.geolocation) navigator.geolocation.clearWatch(S.geoWatch);
      window.removeEventListener('deviceorientation', onOrient, true);
      window.removeEventListener('deviceorientationabsolute', onOrient, true);
      window.removeEventListener('resize', S._resize); window.removeEventListener('orientationchange', S._resize);
      S.root.classList.remove('in');
      const r=S.root; setTimeout(()=>{ r.remove(); }, 220);
      S=null;
    }
    // واجهة عامة نظيفة للتوسعة لاحقًا (GLB، أراضٍ متعددة، قياس، أثاث...)
    return { open, close, cfg, model, _internals:{ bearing, distM, landCorners } };
  })();

  render();
  // auto-dismiss the splash after the intro animation, then run the promo carousel
  setTimeout(()=>{ if(!state.splashDone){ setState({splashDone:true}); if(!state.onboardDone) _startOnboard(); } }, 1900);
})();
</script>
</body>
</html>
